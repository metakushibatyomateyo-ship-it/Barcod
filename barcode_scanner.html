<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>バーコードスキャナー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1216;
    --panel:#171b21;
    --panel2:#1e232b;
    --border:#2a303a;
    --text:#eef1f4;
    --muted:#8b93a1;
    --accent:#ff4438;
    --accent-dim:rgba(255,68,56,0.16);
    --success:#2fd47a;
    --success-dim:rgba(47,212,122,0.16);
    --danger:#ff6b57;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{
    display:flex; flex-direction:column;
    height:100dvh; max-width:560px; margin:0 auto;
    background:var(--bg);
  }
  header{
    padding:calc(12px + var(--safe-top)) 16px 12px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  header h1{ font-size:17px; font-weight:700; margin:0; letter-spacing:0.01em; }
  header p{ margin:2px 0 0; font-size:12px; color:var(--muted); }
  #count-badge{
    font-size:13px; font-weight:700; color:var(--accent);
    background:var(--accent-dim); border-radius:999px;
    padding:4px 12px; white-space:nowrap;
  }

  .scanner-view{
    position:relative; width:100%; flex-shrink:0;
    height:38vh; min-height:220px; max-height:340px;
    background:#000; overflow:hidden;
  }
  #reader{ position:absolute; inset:0; }
  #reader video{
    object-fit:cover !important; width:100% !important; height:100% !important;
    position:absolute !important; top:0 !important; left:0 !important;
    /* The library continues to read this video. On some iPhones Safari paints
       it black, so the visible preview is drawn to #cameraPreview instead. */
    opacity:0;
  }
  #cameraPreview{
    position:absolute; inset:0; z-index:3; width:100%; height:100%;
    display:none; background:#000;
  }
  #cameraPreview.show{ display:block; }
  #reader img{ display:none !important; } /* hide default camera-permission icon graphic */
  /* the library's own built-in scan-region overlay doesn't line up once we force
     the video to fill the container above, so we hide it and draw our own frame */
  #qr-shaded-region{ display:none !important; }

  .scan-frame{
    position:absolute; z-index:7; pointer-events:none;
    top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(260px, 62%); height:64px;
    border:2px solid rgba(255,255,255,0.9);
    border-radius:10px;
    box-shadow:0 0 0 9999px rgba(0,0,0,0.38);
    display:none;
  }
  .scan-frame.show{ display:block; }
  .scan-frame::before, .scan-frame::after{
    content:""; position:absolute; width:18px; height:18px;
    border:3px solid var(--accent); border-radius:2px;
  }
  .scan-frame::before{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .scan-frame::after{ bottom:-2px; right:-2px; border-left:none; border-top:none; }

  .insecure-banner{
    display:none; padding:10px 16px; font-size:12px; line-height:1.5;
    background:var(--accent-dim); color:var(--accent); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .insecure-banner.show{ display:block; }

  .video-off{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; z-index:5;
    color:var(--muted); font-size:13px; text-align:center; padding:0 24px;
    background:#000;
  }
  .video-off svg{ width:36px; height:36px; opacity:0.5; }

  .hint-bar{
    padding:8px 16px; font-size:12px; color:var(--muted); text-align:center;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .hint-bar b{ color:var(--text); }

  .flash-layer{
    position:absolute; inset:0; pointer-events:none; opacity:0; z-index:6;
    transition:opacity 0.08s ease;
  }
  .flash-layer.on{ opacity:1; transition:none; }
  .flash-layer.success{ background:var(--success-dim); }
  .flash-layer.dup{ background:rgba(255,180,50,0.22); }

  .controls{
    display:flex; gap:8px; padding:10px 16px;
    border-bottom:1px solid var(--border); flex-shrink:0;
    align-items:center;
  }
  button{ font-family:inherit; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--panel);
    color:var(--text); border-radius:10px; padding:10px 14px;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn:active{ background:var(--panel2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1a0503; flex:1; }
  .btn-primary.stop{ background:var(--panel2); border-color:var(--danger); color:var(--danger); }
  .icon-btn{ width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn.active{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn[hidden]{ display:none; }

  .toggle-row{ display:flex; align-items:center; gap:6px; margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; }
  .toggle-row input{ width:16px; height:16px; accent-color:var(--accent); }

  .results{ flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 16px 0; }
  .results-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-shrink:0; }
  .results-header h2{ font-size:13px; margin:0; color:var(--muted); font-weight:600; }
  .results-header h2 b{ color:var(--text); font-weight:700; }
  .link-btn{ background:none; border:none; color:var(--muted); font-size:12px; padding:4px; cursor:pointer; text-decoration:underline; }
  .link-btn:active{ color:var(--danger); }

  .table-wrap{ flex:1; min-height:0; overflow-y:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    position:sticky; top:0; background:var(--panel2);
    text-align:left; font-size:11px; color:var(--muted); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:9px 10px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  td.code{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; word-break:break-all; max-width:1px; width:100%; }
  td.fmt{ color:var(--muted); font-size:11px; white-space:nowrap; }
  td.time{ color:var(--muted); font-size:11px; white-space:nowrap; }
  td.del{ text-align:right; white-space:nowrap; }
  .del-btn{ background:none; border:none; color:var(--muted); font-size:16px; padding:4px 6px; cursor:pointer; line-height:1; }
  .del-btn:active{ color:var(--danger); }
  .empty-state{ padding:32px 16px; text-align:center; color:var(--muted); font-size:13px; }

  .export-bar{ padding:12px 16px calc(12px + var(--safe-bottom)); flex-shrink:0; }
  #exportCsv{ width:100%; padding:14px; font-size:15px; border-radius:12px; }
  #exportCsv:disabled{ opacity:0.4; }

  .toast{
    position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom));
    transform:translateX(-50%) translateY(10px);
    background:#22262d; color:var(--text); border:1px solid var(--border);
    padding:9px 16px; border-radius:999px; font-size:13px;
    opacity:0; transition:opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none; max-width:80%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>バーコードスキャナー</h1>
      <p>連続読み取り・CSV出力（初回のみネット接続が必要）</p>
    </div>
    <div id="count-badge">0 件</div>
  </header>

  <div class="insecure-banner" id="insecureBanner">
    ⚠️ このページは安全な接続（HTTPS）で開かれていないため、iPhoneのカメラを使用できません。ファイルをそのまま開くのではなく、HTTPSで配信されたページから開いてください（下の説明を参照）。
  </div>

  <div class="scanner-view" id="scannerView">
    <div id="reader"></div>
    <canvas id="cameraPreview" aria-hidden="true"></canvas>
    <div class="scan-frame" id="scanFrame"></div>
    <div class="video-off" id="videoOff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h4l2-2h6l2 2h4v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="videoOffText">「開始」を押してカメラを起動してください</span>
    </div>
    <div class="flash-layer" id="flashLayer"></div>
  </div>
  <div class="hint-bar">明るい場所で、バーコードを白い枠内に収めてください</div>

  <div class="controls">
    <button class="btn btn-primary" id="toggleScan">開始</button>
    <button class="btn icon-btn" id="torchBtn" hidden title="ライト">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M8 12a4 4 0 118 0c0 1.8-1 2.6-2 3.5-.6.6-1 1-1 1.5h-2c0-.5-.4-.9-1-1.5-1-.9-2-1.7-2-3.5z"/></svg>
    </button>
    <label class="toggle-row"><input type="checkbox" id="dupToggle">重複許可</label>
    <label class="toggle-row"><input type="checkbox" id="holdToggle">長押しでスキャン</label>
  </div>

  <div class="results">
    <div class="results-header">
      <h2>読み取り結果 <b id="resultCount">0</b>件</h2>
      <button class="link-btn" id="clearAll">全て消去</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>コード内容</th><th>形式</th><th>時刻</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty-state" id="emptyState">まだ読み取り結果はありません</div>
    </div>
  </div>

  <div class="export-bar">
    <button class="btn btn-primary" id="exportCsv" disabled>CSVをダウンロード（0件）</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  const videoOff = document.getElementById('videoOff');
  const videoOffText = document.getElementById('videoOffText');
  const toggleScanBtn = document.getElementById('toggleScan');
  const torchBtn = document.getElementById('torchBtn');
  const dupToggle = document.getElementById('dupToggle');
  const holdToggle = document.getElementById('holdToggle');
  const scanFrame = document.getElementById('scanFrame');
  const insecureBanner = document.getElementById('insecureBanner');
  const readerEl = document.getElementById('reader');
  const previewCanvas = document.getElementById('cameraPreview');
  const tbody = document.getElementById('tbody');
  const emptyState = document.getElementById('emptyState');
  const countBadge = document.getElementById('count-badge');
  const resultCount = document.getElementById('resultCount');
  const clearAllBtn = document.getElementById('clearAll');
  const exportBtn = document.getElementById('exportCsv');
  const flashLayer = document.getElementById('flashLayer');
  const toastEl = document.getElementById('toast');

  let results = [];
  let html5QrCode = null;
  let scanning = false;
  // iOS releases the camera asynchronously.  Serializing transitions avoids
  // a new start racing a previous stop and leaving a black preview behind.
  let cameraBusy = false;
  let previewFrameId = null;
  let torchOn = false;
  let lastCode = null;
  let lastTime = 0;
  let audioCtx = null;
  const COOLDOWN_MS = 1500;

  const FORMAT_LABELS = {
    QR_CODE:'QRコード', EAN_13:'EAN-13', EAN_8:'EAN-8', CODE_128:'CODE128',
    CODE_39:'CODE39', CODE_93:'CODE93', CODABAR:'CODABAR', ITF:'ITF',
    UPC_A:'UPC-A', UPC_E:'UPC-E', DATA_MATRIX:'データマトリックス',
    PDF_417:'PDF417', AZTEC:'Aztec'
  };
  function formatLabel(f){ return FORMAT_LABELS[f] || f || '不明'; }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }
  function flash(kind){
    flashLayer.className = 'flash-layer on ' + kind;
    setTimeout(()=>{ flashLayer.className = 'flash-layer'; }, 140);
  }
  function beep(freq, ok){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = freq;
      o.type = ok ? 'sine' : 'square';
      const now = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
      o.start(now); o.stop(now + 0.14);
    }catch(e){}
  }
  function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }

  // ---- scan window size ----
  // NOTE: We previously tried to size this box using real-world millimeters
  // (CSS "mm" units). That doesn't work on phones: mobile browsers scale the
  // CSS reference pixel so pages remain readable on a small screen, which
  // makes 1mm in CSS render noticeably larger than 1 physical mm. The result
  // was a scan window much bigger than intended. Instead we size the box as
  // a fraction of the camera preview, tuned for a 1D barcode's wide/short
  // shape and calibrated by eye on an iPhone 15 (393pt-wide viewport).
  function qrboxFn(viewfinderWidth, viewfinderHeight){
    const w = Math.max(160, Math.min(260, Math.floor(viewfinderWidth * 0.62)));
    const h = Math.max(50, Math.min(90, Math.floor(w / 3.1), Math.floor(viewfinderHeight * 0.22)));
    return { width: w, height: h };
  }

  // html5-qrcode can successfully decode frames on iPhone Safari while its
  // own <video> element is rendered as a black rectangle. Drawing those same
  // frames to a separate canvas avoids that WebKit display bug.
  function startCameraPreview(sourceVideo){
    stopCameraPreview();
    const ctx = previewCanvas.getContext('2d');
    previewCanvas.classList.add('show');
    const draw = ()=>{
      const rect = previewCanvas.getBoundingClientRect();
      const sourceWidth = sourceVideo.videoWidth;
      const sourceHeight = sourceVideo.videoHeight;
      if(rect.width && rect.height && sourceWidth && sourceHeight){
        const scale = window.devicePixelRatio || 1;
        const targetWidth = Math.round(rect.width * scale);
        const targetHeight = Math.round(rect.height * scale);
        if(previewCanvas.width !== targetWidth || previewCanvas.height !== targetHeight){
          previewCanvas.width = targetWidth;
          previewCanvas.height = targetHeight;
        }
        const sourceRatio = sourceWidth / sourceHeight;
        const targetRatio = targetWidth / targetHeight;
        let sx = 0, sy = 0, sw = sourceWidth, sh = sourceHeight;
        if(sourceRatio > targetRatio){
          sw = sourceHeight * targetRatio;
          sx = (sourceWidth - sw) / 2;
        }else{
          sh = sourceWidth / targetRatio;
          sy = (sourceHeight - sh) / 2;
        }
        ctx.drawImage(sourceVideo, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);
      }
      previewFrameId = requestAnimationFrame(draw);
    };
    previewFrameId = requestAnimationFrame(draw);
  }
  function stopCameraPreview(){
    if(previewFrameId !== null){ cancelAnimationFrame(previewFrameId); previewFrameId = null; }
    previewCanvas.classList.remove('show');
    const ctx = previewCanvas.getContext('2d');
    ctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  }

  // ---- custom scan-frame overlay (kept in sync with the qrbox size) ----
  function positionScanFrame(){
    let rect = readerEl.getBoundingClientRect();
    if(!rect.width || !rect.height){
      rect = document.getElementById('scannerView').getBoundingClientRect();
    }
    if(!rect.width || !rect.height) return; // truly not laid out yet; CSS default keeps a safe centered box visible
    const box = qrboxFn(rect.width, rect.height);
    scanFrame.style.transform = 'none'; // clear the CSS centering transform now that we set exact left/top below
    scanFrame.style.width = box.width + 'px';
    scanFrame.style.height = box.height + 'px';
    scanFrame.style.left = ((rect.width - box.width) / 2) + 'px';
    scanFrame.style.top = ((rect.height - box.height) / 2) + 'px';
  }
  window.addEventListener('resize', ()=>{ if(scanning) positionScanFrame(); });
  window.addEventListener('orientationchange', ()=>{ if(scanning) setTimeout(positionScanFrame, 300); });

  // ---- secure-context check (iOS Safari blocks camera entirely on file:// or http://) ----
  function isSecureEnough(){
    if(window.isSecureContext) return true;
    return location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  }
  function checkSecureContext(){
    if(!isSecureEnough()){
      insecureBanner.classList.add('show');
      toggleScanBtn.disabled = true;
      toggleScanBtn.textContent = 'HTTPS化が必要です';
      videoOffText.textContent = 'HTTPSで配信されたページから開き直してください';
      return false;
    }
    return true;
  }

  // ---- friendly Japanese error messages for getUserMedia failures ----
  function friendlyCameraError(err){
    if(!isSecureEnough()){
      return 'このページがHTTPSで開かれていないため、iPhoneのカメラを使用できません。';
    }
    // html5-qrcode frequently rejects with a plain string rather than an
    // Error/DOMException, so surface it as-is — it usually names the real
    // underlying getUserMedia error, which we were previously swallowing.
    if(typeof err === 'string' && err){
      return err;
    }
    const name = err && err.name;
    switch(name){
      case 'NotAllowedError':
      case 'PermissionDeniedError':
        return 'カメラへのアクセスが許可されていません。設定アプリ →このWebサイトの設定（または Safari）→カメラ を「許可」にしてから、もう一度お試しください。';
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        return '使用できるカメラが見つかりませんでした。';
      case 'NotReadableError':
      case 'TrackStartError':
        return 'カメラが他のアプリで使用中の可能性があります。他のカメラアプリを閉じてから再度お試しください。';
      case 'OverconstrainedError':
      case 'ConstraintNotSatisfiedError':
        return '背面カメラを起動できませんでした。';
      case 'SecurityError':
        return 'セキュリティ上の理由でカメラを起動できませんでした（HTTPS接続が必要です）。';
      default:
        return (err && err.message) ? `${err.message}${name ? ' ('+name+')' : ''}` : `カメラを起動できませんでした（${name || String(err) || '不明なエラー'}）`;
    }
  }

  function getSupportedFormats(){
    if(!window.Html5QrcodeSupportedFormats) return undefined;
    const F = window.Html5QrcodeSupportedFormats;
    return [F.QR_CODE, F.EAN_13, F.EAN_8, F.CODE_128, F.CODE_39, F.CODE_93,
             F.CODABAR, F.ITF, F.UPC_A, F.UPC_E, F.DATA_MATRIX, F.PDF_417, F.AZTEC];
  }

  // ---- scan callbacks ----
  function onScanSuccess(decodedText, decodedResult){
    if(!decodedText) return;
    const now = Date.now();
    if(decodedText === lastCode && (now - lastTime) < COOLDOWN_MS) return;
    lastCode = decodedText; lastTime = now;

    let format = '';
    try{ format = decodedResult.result.format.formatName; }catch(e){}

    if(!dupToggle.checked && results.some(r=>r.value === decodedText)){
      flash('dup'); beep(300, false); vibrate(40);
      toast('同じコードは記録済みです');
      return;
    }
    addResult(decodedText, formatLabel(format));
    flash('success'); beep(1700, true); vibrate(60);
  }
  function onScanFailure(){ /* fires every frame with no code found - ignore */ }

  function addResult(value, format){
    results.unshift({ id: nowId(), value, format, time: new Date() });
    render();
  }
  function nowId(){ return Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  // ---- render ----
  function render(){
    countBadge.textContent = results.length + ' 件';
    resultCount.textContent = results.length;
    exportBtn.disabled = results.length === 0;
    exportBtn.textContent = 'CSVをダウンロード（' + results.length + '件）';
    emptyState.style.display = results.length ? 'none' : 'block';
    tbody.innerHTML = results.map((r, i)=>{
      const n = results.length - i;
      return '<tr>' +
        '<td>' + n + '</td>' +
        '<td class="code">' + escapeHtml(r.value) + '</td>' +
        '<td class="fmt">' + escapeHtml(r.format) + '</td>' +
        '<td class="time">' + fmtTime(r.time) + '</td>' +
        '<td class="del"><button class="del-btn" data-del="' + r.id + '" aria-label="削除">✕</button></td>' +
      '</tr>';
    }).join('');
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtTime(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }

  tbody.addEventListener('click', e=>{
    const btn = e.target.closest('[data-del]');
    if(!btn) return;
    results = results.filter(r=>r.id !== btn.dataset.del);
    render();
  });
  clearAllBtn.addEventListener('click', ()=>{
    if(!results.length) return;
    if(confirm('読み取り結果をすべて消去しますか？')){ results = []; render(); }
  });

  // ---- CSV export ----
  function csvEscape(s){
    s = String(s);
    if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function fmtDateTime(d){
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  exportBtn.addEventListener('click', ()=>{
    if(!results.length) return;
    const rows = results.slice().reverse().map((r, i)=>[i+1, r.value, r.format, fmtDateTime(r.time)]);
    const header = ['No','コード内容','形式','日時'];
    const csv = [header, ...rows].map(row=>row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const fname = 'barcode_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '_' +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.csv';
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('CSVを保存しました');
  });

  // ---- torch ----
  function setupTorch(){
    try{
      const caps = html5QrCode.getRunningTrackCapabilities();
      if(caps && caps.torch){
        torchBtn.hidden = false;
        torchBtn.onclick = async ()=>{
          torchOn = !torchOn;
          try{ await html5QrCode.applyVideoConstraints({ advanced:[{ torch: torchOn }] }); }
          catch(e){ torchOn = !torchOn; }
          torchBtn.classList.toggle('active', torchOn);
        };
      }else{
        torchBtn.hidden = true;
      }
    }catch(e){ torchBtn.hidden = true; }
  }

  // ---- start / stop ----
  async function startScanning(){
    if(!checkSecureContext()) return;
    if(cameraBusy || scanning) return;
    cameraBusy = true;
    toggleScanBtn.disabled = true;
    toggleScanBtn.textContent = '起動中…';
    try{
      if(typeof Html5Qrcode === 'undefined'){
        throw new Error('スキャナーを読み込めませんでした。一度だけ電波の良い場所で開いてください。');
      }
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error('このブラウザはカメラに対応していません');
      }

      if(!html5QrCode){
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: getSupportedFormats(),
          verbose:false
        });
      }
      videoOff.style.display = 'none';
      lastCode = null;
      // Do not request a fixed/ideal resolution here.  On some iPhones that
      // combination powers the rear camera (and therefore the torch) but
      // results in a black or frozen video preview.
      await html5QrCode.start(
        { facingMode:'environment' },
        { fps:10, qrbox:qrboxFn, disableFlip:false },
        onScanSuccess,
        onScanFailure
      );
      // Force iOS-friendly playback attributes/state in case the library's
      // own handling gets skipped in this WebKit version.
      const videoEl = readerEl.querySelector('video');
      if(videoEl){
        videoEl.setAttribute('playsinline', 'true');
        videoEl.setAttribute('webkit-playsinline', 'true');
        videoEl.muted = true;
        videoEl.play().catch(()=>{});
        startCameraPreview(videoEl);
      }
      scanning = true;
      setupTorch();
      positionScanFrame();
      scanFrame.classList.add('show');
      toggleScanBtn.textContent = holdToggle.checked ? 'スキャン中（離すと停止）' : '停止';
      toggleScanBtn.classList.add('stop');
    }catch(err){
      // Clean up a scanner created during a failed attempt before allowing a
      // retry; otherwise Safari can retain a broken camera track.
      if(html5QrCode){
        try{ await html5QrCode.stop(); }catch(e){}
        try{ html5QrCode.clear(); }catch(e){}
        html5QrCode = null;
      }
      stopCameraPreview();
      videoOff.style.display = 'flex';
      videoOffText.textContent = friendlyCameraError(err);
      updateIdleButtonLabel();
      toast('カメラの起動に失敗しました');
    }finally{
      cameraBusy = false;
      toggleScanBtn.disabled = false;
    }
  }

  async function stopScanning(){
    if(cameraBusy || !scanning) return;
    cameraBusy = true;
    scanning = false;
    toggleScanBtn.disabled = true;
    scanFrame.classList.remove('show');
    try{
      if(html5QrCode){
        try{ await html5QrCode.stop(); }catch(e){}
        try{ html5QrCode.clear(); }catch(e){}
        html5QrCode = null;
      }
    }finally{
      stopCameraPreview();
      videoOff.style.display = 'flex';
      videoOffText.textContent = '「開始」を押してカメラを起動してください';
      toggleScanBtn.textContent = holdToggle.checked ? '押している間スキャン' : '開始';
      toggleScanBtn.classList.remove('stop');
      torchBtn.hidden = true;
      torchOn = false;
      cameraBusy = false;
      toggleScanBtn.disabled = false;
    }
  }

  function updateIdleButtonLabel(){
    if(scanning) return;
    toggleScanBtn.textContent = holdToggle.checked ? '押している間スキャン' : '開始';
  }
  holdToggle.addEventListener('change', updateIdleButtonLabel);

  // Tap-to-toggle mode (default): tap once to start continuous scanning,
  // tap again to stop. Ignored while "press and hold" mode is on, since
  // pointer events below handle start/stop in that mode instead.
  toggleScanBtn.addEventListener('click', ()=>{
    if(holdToggle.checked) return;
    if(scanning) stopScanning(); else startScanning();
  });

  // Press-and-hold mode: camera scans only while the button is held down,
  // and stops the instant it's released — handy for quickly sweeping over
  // several barcodes in a row without tapping between each one.
  let holdActive = false;
  toggleScanBtn.addEventListener('pointerdown', (e)=>{
    if(!holdToggle.checked) return;
    e.preventDefault();
    holdActive = true;
    toggleScanBtn.textContent = 'スキャン中（離すと停止）';
    if(!scanning) startScanning();
  });
  function releaseHold(){
    if(!holdToggle.checked || !holdActive) return;
    holdActive = false;
    if(scanning) stopScanning();
    updateIdleButtonLabel();
  }
  toggleScanBtn.addEventListener('pointerup', releaseHold);
  toggleScanBtn.addEventListener('pointercancel', releaseHold);
  toggleScanBtn.addEventListener('pointerleave', releaseHold);

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && scanning) stopScanning();
  });

  render();
  checkSecureContext();
  updateIdleButtonLabel();
})();
</script>
</body>
</html>
