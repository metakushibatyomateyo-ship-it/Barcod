<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>バーコードスキャナー</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#2f81f7;
    --danger:#f85149;
    --ok:#3fb950;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:520px;margin:0 auto;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1{font-size:17px;font-weight:600;margin:4px 0 12px;}
  .status{
    font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px;
  }
  .status.error{color:var(--danger);}
  .status.ok{color:var(--ok);}

  .video-box{
    position:relative;width:100%;aspect-ratio:3/4;
    background:#000;border-radius:14px;overflow:hidden;
    border:1px solid var(--border);
  }
  video{
    width:100%;height:100%;object-fit:cover;
    display:block;background:#000;
    /* iOS Safari: playsinline属性と併用でインライン再生を保証 */
  }
  .guide-line{
    position:absolute;left:8%;right:8%;top:50%;
    height:2px;background:rgba(63,185,80,.9);
    box-shadow:0 0 6px rgba(63,185,80,.8);
    transform:translateY(-1px);
    pointer-events:none;
  }
  .hint-overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;text-align:center;padding:24px;
    pointer-events:none;
  }

  .controls{
    display:flex;gap:8px;margin-top:12px;
  }
  button{
    flex:1;padding:13px 10px;border-radius:10px;border:1px solid var(--border);
    font-size:15px;font-weight:600;cursor:pointer;
    background:var(--panel);color:var(--text);
    -webkit-tap-highlight-color:transparent;
    transition:opacity .15s;
  }
  button:active{opacity:.7;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.stop{background:var(--danger);border-color:var(--danger);color:#fff;}
  button.torch.on{background:#e3b341;border-color:#e3b341;color:#000;}

  .result-panel{
    margin-top:18px;
  }
  .result-panel h2{
    font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;
  }
  .result-list{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:6px;
    max-height:260px;overflow-y:auto;
  }
  .result-item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .result-item .code{
    font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;
    word-break:break-all;
  }
  .result-item .meta{
    font-size:11px;color:var(--muted);white-space:nowrap;
  }
  .result-item button{
    flex:none;padding:6px 10px;font-size:12px;font-weight:500;
  }
  .empty{
    color:var(--muted);font-size:13px;padding:12px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>バーコードスキャナー(JAN/EAN・UPC・CODE128)</h1>
  <div id="status" class="status">準備中…</div>

  <div class="video-box">
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
    <div class="guide-line" id="guideLine" style="display:none;"></div>
    <div class="hint-overlay" id="hintOverlay">「開始」を押してカメラを起動してください</div>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary">開始</button>
    <button id="torchBtn" disabled>ライト</button>
  </div>

  <div class="result-panel">
    <h2>読み取り結果</h2>
    <ul id="resultList" class="result-list"></ul>
    <div id="emptyMsg" class="empty">まだ読み取りはありません</div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
(function(){
  "use strict";

  // ---- HTTPS/localhost チェック(file://対策の明示表示) ----
  var isSecure = location.protocol === "https:" || location.hostname === "localhost";
  var statusEl = document.getElementById("status");
  var hintOverlay = document.getElementById("hintOverlay");
  var guideLine = document.getElementById("guideLine");
  var video = document.getElementById("video");
  var startBtn = document.getElementById("startBtn");
  var torchBtn = document.getElementById("torchBtn");
  var resultList = document.getElementById("resultList");
  var emptyMsg = document.getElementById("emptyMsg");

  function setStatus(msg, kind){
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  if (!isSecure) {
    setStatus("HTTPSで開いてください(file:// や http:// ではiPhoneのカメラは起動できません)", "error");
    startBtn.disabled = true;
  }
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    setStatus("このブラウザはカメラAPIに対応していません", "error");
    startBtn.disabled = true;
  }

  // ---- 状態機械: idle -> starting -> running -> stopping -> idle ----
  var STATE = { IDLE:"idle", STARTING:"starting", RUNNING:"running", STOPPING:"stopping" };
  var state = STATE.IDLE;

  var currentStream = null;
  var currentTrack = null;
  var scanTimer = null;
  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d", { willReadFrequently: true });

  // ---- ZXing: video/streamの管理はさせず、canvasのみ解析に使う ----
  var hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  var multiReader = new ZXing.MultiFormatReader();
  multiReader.setHints(hints);

  var lastCode = null;
  var lastTime = 0;
  var DUP_SUPPRESS_MS = 1500;
  var SCAN_INTERVAL_MS = 180; // 約5.5fpsで解析(iPhoneの負荷対策)

  function formatLabel(f){
    var names = {};
    names[ZXing.BarcodeFormat.EAN_13] = "EAN-13";
    names[ZXing.BarcodeFormat.EAN_8]  = "EAN-8";
    names[ZXing.BarcodeFormat.UPC_A]  = "UPC-A";
    names[ZXing.BarcodeFormat.UPC_E]  = "UPC-E";
    names[ZXing.BarcodeFormat.CODE_128] = "CODE128";
    names[ZXing.BarcodeFormat.CODE_39]  = "CODE39";
    return names[f] || String(f);
  }

  function beep(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var actx = new Ctx();
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.frequency.value = 880;
      gain.gain.value = 0.08;
      osc.connect(gain).connect(actx.destination);
      osc.start();
      setTimeout(function(){ osc.stop(); actx.close(); }, 90);
    }catch(e){ /* Audio非対応環境は無視 */ }
  }

  function addResult(text, format){
    emptyMsg.style.display = "none";
    var li = document.createElement("li");
    li.className = "result-item";
    var now = new Date();
    var timeStr = now.toLocaleTimeString("ja-JP", {hour:"2-digit",minute:"2-digit",second:"2-digit"});
    li.innerHTML =
      '<div>' +
        '<div class="code"></div>' +
        '<div class="meta"></div>' +
      '</div>' +
      '<button type="button">コピー</button>';
    li.querySelector(".code").textContent = text;
    li.querySelector(".meta").textContent = formatLabel(format) + " ・ " + timeStr;
    var copyBtn = li.querySelector("button");
    copyBtn.addEventListener("click", function(){
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){
          copyBtn.textContent = "コピー済";
          setTimeout(function(){ copyBtn.textContent = "コピー"; }, 1200);
        }).catch(function(){});
      }
    });
    resultList.insertBefore(li, resultList.firstChild);
  }

  function handleDecoded(text, format){
    var now = Date.now();
    if (text === lastCode && (now - lastTime) < DUP_SUPPRESS_MS) {
      return; // 同一コードの連続重複を抑制
    }
    lastCode = text;
    lastTime = now;
    if (navigator.vibrate) navigator.vibrate(60);
    beep();
    addResult(text, format);
  }

  function scanLoop(){
    if (state !== STATE.RUNNING) return;

    if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
      // 解析用に縮小コピー(iPhoneでの処理負荷を抑える)。表示側のvideoには一切触れない。
      var targetW = 640;
      var scale = targetW / video.videoWidth;
      var w = targetW;
      var h = Math.round(video.videoHeight * scale);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      ctx.drawImage(video, 0, 0, w, h);

      try {
        var luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
        var binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
        var result = multiReader.decode(binaryBitmap);
        handleDecoded(result.getText(), result.getBarcodeFormat());
      } catch (err) {
        // NotFoundException等は「今フレームでは見つからなかった」だけなので無視して継続
      }
    }

    scanTimer = setTimeout(scanLoop, SCAN_INTERVAL_MS);
  }

  function updateTorchAvailability(){
    torchBtn.disabled = true;
    torchBtn.classList.remove("on");
    torchBtn.textContent = "ライト";
    if (!currentTrack) return;
    var caps = {};
    try { caps = currentTrack.getCapabilities ? currentTrack.getCapabilities() : {}; } catch(e){}
    if (caps && caps.torch) {
      torchBtn.disabled = false;
    }
  }

  torchBtn.addEventListener("click", function(){
    if (!currentTrack) return;
    var isOn = torchBtn.classList.contains("on");
    currentTrack.applyConstraints({ advanced: [{ torch: !isOn }] })
      .then(function(){
        torchBtn.classList.toggle("on", !isOn);
        torchBtn.textContent = !isOn ? "ライトOFF" : "ライト";
      })
      .catch(function(){
        setStatus("ライトを操作できませんでした", "error");
      });
  });

  function stopCamera(){
    return new Promise(function(resolve){
      if (state === STATE.STOPPING || state === STATE.IDLE) {
        resolve();
        return;
      }
      state = STATE.STOPPING;
      setStatus("停止処理中…");

      if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }

      var tracksToStop = currentStream ? currentStream.getTracks() : [];
      var pending = tracksToStop.length;

      function finish(){
        video.pause();
        video.srcObject = null;
        currentStream = null;
        currentTrack = null;
        updateTorchAvailability();
        guideLine.style.display = "none";
        hintOverlay.style.display = "flex";
        state = STATE.IDLE;
        setStatus("停止しました。「開始」でカメラを再開できます");
        startBtn.textContent = "開始";
        startBtn.classList.remove("stop");
        startBtn.classList.add("primary");
        startBtn.disabled = false;
        resolve();
      }

      if (pending === 0) {
        finish();
        return;
      }

      // Safariはトラック解放に時間がかかることがあるため、
      // 全トラックのstop完了(onended)を待ってから次のstartを許可する
      var settled = false;
      var safetyTimeout = setTimeout(function(){
        if (!settled) { settled = true; finish(); }
      }, 800);

      tracksToStop.forEach(function(track){
        track.addEventListener("ended", onEnded, { once: true });
        track.stop();
      });

      function onEnded(){
        pending -= 1;
        if (pending <= 0 && !settled) {
          settled = true;
          clearTimeout(safetyTimeout);
          finish();
        }
      }
    });
  }

  function startCamera(){
    if (state !== STATE.IDLE) return; // starting/running/stopping中は多重起動を防止
    state = STATE.STARTING;
    startBtn.disabled = true;
    torchBtn.disabled = true;
    setStatus("カメラ起動中…");

    var constraints = {
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream){
        if (state !== STATE.STARTING) {
          // startCamera中にstopが割り込んだ場合は破棄
          stream.getTracks().forEach(function(t){ t.stop(); });
          return;
        }
        currentStream = stream;
        currentTrack = stream.getVideoTracks()[0] || null;

        video.srcObject = stream;
        // iOS Safariはplay()をユーザー操作から呼ぶ必要があるため、
        // このボタンのclickハンドラ内(=ユーザー操作の同期コンテキスト)で呼ぶ
        var playPromise = video.play();
        if (playPromise && playPromise.catch) {
          playPromise.catch(function(err){
            setStatus("映像の再生に失敗しました: " + err.message, "error");
          });
        }

        // 可能ならピント連続合わせを試行(対応していれば適用、非対応でも無視)
        if (currentTrack && currentTrack.getCapabilities) {
          try {
            var caps = currentTrack.getCapabilities();
            if (caps.focusMode && caps.focusMode.indexOf("continuous") !== -1) {
              currentTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function(){});
            }
          } catch(e){}
        }

        hintOverlay.style.display = "none";
        guideLine.style.display = "block";
        updateTorchAvailability();

        state = STATE.RUNNING;
        setStatus("スキャン中… バーコードをガイド線に合わせてください", "ok");
        startBtn.textContent = "停止";
        startBtn.classList.remove("primary");
        startBtn.classList.add("stop");
        startBtn.disabled = false;

        scanLoop();
      })
      .catch(function(err){
        state = STATE.IDLE;
        startBtn.disabled = false;
        if (err && err.name === "NotAllowedError") {
          setStatus("カメラへのアクセスが許可されていません。Safariの設定でカメラ権限を確認してください", "error");
        } else if (err && err.name === "NotFoundError") {
          setStatus("使用できるカメラが見つかりません", "error");
        } else {
          setStatus("カメラ起動エラー: " + (err && err.message ? err.message : err), "error");
        }
      });
  }

  startBtn.addEventListener("click", function(){
    if (state === STATE.RUNNING) {
      stopCamera();
    } else if (state === STATE.IDLE) {
      startCamera();
    }
    // STARTING/STOPPING中はボタンがdisabledなのでここには来ない
  });

  // ページを離れる/バックグラウンドに行くときはカメラを確実に解放
  document.addEventListener("visibilitychange", function(){
    if (document.hidden && state === STATE.RUNNING) {
      stopCamera();
    }
  });
  window.addEventListener("pagehide", function(){
    if (state === STATE.RUNNING || state === STATE.STARTING) {
      stopCamera();
    }
  });

  if (isSecure) {
    setStatus("準備完了。「開始」を押してください");
  }
})();
</script>
</body>
</html>
